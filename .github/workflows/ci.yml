name: CI

# Runs on every push and pull request. This is the gate that used to not exist:
# five audit scripts lived in web/scripts/ and only one of them ran, and only as
# a side effect of prebuild. Content defects reached production because nothing
# checked them.
#
# Jobs are deliberately separate so a failure names itself in the UI. A red
# "Audits" is a content problem; a red "Types and build" is a code problem.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  audits:
    name: Audits
    runs-on: ubuntu-latest
    steps:
      # Full history: audit-tasks-stamp.mjs measures how far the TASKS.md stamp
      # is behind HEAD. On a depth-1 checkout it can only check the date.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The audits read references/*.md, and the content bundle is generated
      # from it. Sync first, or audit-publications compares against a stale file.
      - name: Sync generated content
        run: npm run sync

      - name: Run the audit suite
        run: npm run audit

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Sync generated content
        run: npm run sync

      - name: Vitest
        run: npm run test:run

  build:
    name: Types and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # `npm run build` triggers prebuild, which syncs and audits, then compiles.
      # This is the command Railway runs, so a green build here means the deploy
      # will compile.
      - name: Build
        run: npm run build

      # audit-rendered-completeness fetches every page from a running server. It
      # is skipped everywhere else, so this is the only place it actually runs.
      # A permanently skipped check is not a check.
      - name: Start the server
        run: |
          npm run start &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:4500/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:4500/ || {
            echo "server never came up"; exit 1; }

      - name: Audits, including the server-dependent one
        run: npm run audit
