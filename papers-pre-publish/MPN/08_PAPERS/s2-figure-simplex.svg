<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" width="620" height="560" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">The register simplex, its discontinuity tripod, and the ten triples the shipped instrument produces</title>
<desc id="figDesc">A triangle whose corners are the pure Real, Symbolic and Imaginary registers. Three short segments run from the centre to the midpoint of each side; together they form a tripod, and that tripod is the set on which the dominant register, and therefore the mode, is undefined. Marked on the figure are the ten register triples the shipped instrument actually emitted over the 232 frames of the play library, with the area of each mark proportional to its frame count. One hundred and one frames sit at the three corners, twenty one sit on the tripod or at the centre, six sit elsewhere on the edges, and exactly one point lies in the interior, the centre, which is itself a three way tie. A further one hundred and four frames are not on the triangle at all, because the instrument returned zero for all three registers.</desc>
