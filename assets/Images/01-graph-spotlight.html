<!doctype html>
<meta charset="utf-8">
<title>OXOT loop — Graph · travelling spotlight</title>
<!-- EXTRACTED by scripts/extract-loops.mjs from "Background Loops (standalone).html".
     Self-contained: no bundler, no network request, no font call.
     170 clusters, edge-linked, with a spotlight that moves between stops and dwells. Ported as scene `graph`. -->
<style>
  html,body { margin:0; background:#0B0C0E; color:#6b6f76;
              font:12px/1.6 ui-monospace, Menlo, monospace; }
  header { display:flex; gap:18px; padding:14px 20px; letter-spacing:.14em; text-transform:uppercase; }
  canvas { display:block; width:100%; height:auto; aspect-ratio:2560/1100; background:#0B0C0E; }
</style>
<header><span>Graph · travelling spotlight</span><span>2560 × 1100</span><span>12s loop</span></header>
<canvas id="stage" width="2560" height="1100"></canvas>
<script>
/* Shim: the export was a React component. Only the two things it actually
   uses are provided — a ref object and a no-op setState. Every draw method
   guards on `pane()` returning null, so the two canvases this page does not
   carry are skipped rather than erroring. */
const React = { createRef: () => ({ current: null }) };
class DCLogic { constructor(p) { this.props = p || {}; } setState() {} }


class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.twinRef = React.createRef();
    this.isoRef = React.createRef();
    this.cometRef = React.createRef();
    this.state = { phase: 0 };
  }

  get dur() { return Math.max(3, this.props.loopSeconds ?? 12); }
  get accent() { return this.props.accent ?? '#E05A10'; }

  componentDidMount() {
    this.t0 = performance.now();
    this.build();
    this.loop = () => {
      this.raf = requestAnimationFrame(this.loop);
      try {
        const ph = ((performance.now() - this.t0) / 1000 / this.dur) % 1;
        this.ph = ph;
        this.drawTwin(ph); this.drawIso(ph); this.drawComet(ph);
        if (!this.last || Math.abs(ph - this.last) > 0.02) { this.last = ph; this.setState({ phase: ph }); }
      } catch (e) { console.error(e); }
    };
    this.raf = requestAnimationFrame(this.loop);
  }

  componentWillUnmount() { cancelAnimationFrame(this.raf); }

  rng(seed) {
    let s = seed;
    return () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  }

  vnoise(x, y, seed) {
    const hh = (a, b) => { const n = Math.sin(a * 127.1 + b * 311.7 + seed * 47.3) * 43758.5453; return n - Math.floor(n); };
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return (hh(xi, yi) * (1 - u) + hh(xi + 1, yi) * u) * (1 - v) + (hh(xi, yi + 1) * (1 - u) + hh(xi + 1, yi + 1) * u) * v;
  }

  fbm(x, y, seed) {
    let v = 0, a = 0.5, f = 1;
    for (let i = 0; i < 4; i++) { v += a * this.vnoise(x * f, y * f, seed + i * 11); a *= 0.5; f *= 2; }
    return v;
  }

  build() {
    const W = 2560, H = 1100;
    const r = this.rng(20260812);
    this.pts = [];
    this.centers = [];
    for (let c = 0; c < 170; c++) {
      const cx = 60 + r() * (W - 120), cy = 40 + r() * (H - 80);
      this.centers.push([cx, cy]);
      const n = 8 + (r() * 18) | 0;
      for (let i = 0; i < n; i++) {
        const a = r() * 6.283, rad = Math.pow(r(), 0.6) * (24 + r() * 40);
        this.pts.push({ x: cx + Math.cos(a) * rad, y: cy + Math.sin(a) * rad * 0.8, w: r() * 6.283 });
      }
    }
    this.pairs = [];
    for (let i = 0; i < this.pts.length; i++)
      for (let j = i + 1; j < Math.min(this.pts.length, i + 24); j++) {
        const d = Math.hypot(this.pts[j].x - this.pts[i].x, this.pts[j].y - this.pts[i].y);
        if (d < 56) this.pairs.push([i, j, d]);
      }
    let inner = this.centers.filter(c => c[0] > W * 0.11 && c[0] < W * 0.89 && c[1] > H * 0.11 && c[1] < H * 0.89);
    if (!inner.length) inner = this.centers.slice();
    let spread = [];
    for (let minD = Math.min(W, H) * 0.7; minD >= 20 && spread.length < 5; minD *= 0.82) {
      spread = [];
      for (const c of inner) {
        if (spread.every(s => Math.hypot(s[0] - c[0], s[1] - c[1]) > minD)) spread.push(c);
        if (spread.length === 5) break;
      }
    }
    while (spread.length < 5) spread.push(inner[spread.length % inner.length]);
    this.stops = spread.slice(0, 5);
    const r2 = this.rng(7717);
    this.paths = [];
    for (let p = 0; p < 1950; p++) {
      let x = r2() * W, y = r2() * H;
      const pts = [[x, y]];
      for (let k = 0; k < 54; k++) {
        const a = this.fbm(x / W * 3.7, y / H * 2.7, 12) * Math.PI * 3;
        x += Math.cos(a) * 5; y += Math.sin(a) * 5;
        if (x < -20 || x > W + 20 || y < -20 || y > H + 20) break;
        pts.push([x, y]);
      }
      if (pts.length > 14) this.paths.push({ pts, off: r2() });
    }
  }

  pane(ref, W, H) {
    const c = ref.current; if (!c) return null;
    const ctx = c.getContext('2d');
    ctx.setTransform(c.width / W, 0, 0, c.height / H, 0, 0);
    ctx.fillStyle = '#0B0C0E'; ctx.fillRect(0, 0, W, H);
    ctx.font = '11px "JetBrains Mono", monospace';
    return ctx;
  }

  vignette(ctx, W, H, inner) {
    const g = ctx.createRadialGradient(W / 2, H / 2, H * inner, W / 2, H / 2, H * 1.02);
    g.addColorStop(0, 'rgba(11,12,14,0)'); g.addColorStop(1, 'rgba(11,12,14,1)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  rgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  drawTwin(ph) {
    const W = 2560, H = 1100;
    const ctx = this.pane(this.twinRef, W, H); if (!ctx) return;
    const th = ph * 6.283, acc = this.accent;
    const S = this.stops, n = S.length;
    const seg = ph * n, k = Math.floor(seg), u = seg - k;
    const from = S[k % n], to = S[(k + 1) % n];
    const travel = 0.45;
    const moving = u < travel;
    const e = moving ? (t => t * t * (3 - 2 * t))(u / travel) : 1;
    const dwell = moving ? 0 : (u - travel) / (1 - travel);
    const sx = from[0] + (to[0] - from[0]) * e, sy = from[1] + (to[1] - from[1]) * e;
    const base = this.props.spotlightReach ?? 9;
    const reach = base * (moving ? 0.72 : 1 + 0.1 * Math.sin(dwell * 12.566));
    const drift = (this.props.motion ?? 7);
    const P = this.pts.map(p => {
      const s1 = th + p.w, s2 = th + p.x * 0.006 + p.y * 0.004;
      const x = p.x + drift * Math.sin(s1) + drift * 0.8 * Math.sin(s2);
      const y = p.y + drift * 0.7 * Math.cos(s1) + drift * 0.6 * Math.cos(s2 * 1.0 + 1.1);
      return { x, y, g: Math.max(0, 1 - Math.hypot(x - sx, y - sy) / reach) };
    });
    const linkR = 48 + 7 * Math.sin(th);
    ctx.lineWidth = 0.6;
    for (const [i, j] of this.pairs) {
      const a = P[i], b = P[j];
      const d = Math.hypot(b.x - a.x, b.y - a.y);
      if (d > linkR) continue;
      const g = Math.max(a.g, b.g);
      ctx.strokeStyle = g > 0.02 ? this.rgba(acc, 0.06 + 0.6 * g * g) : 'rgba(150,156,166,' + (0.045 + 0.08 * (1 - d / linkR)) + ')';
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (const p of P) {
      ctx.fillStyle = p.g > 0.02 ? this.rgba(acc, 0.35 + 0.65 * p.g) : 'rgba(190,195,203,.42)';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.g > 0.3 ? 1.5 + p.g : 1.1, 0, 6.3); ctx.fill();
    }
    const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, reach);
    halo.addColorStop(0, this.rgba(acc, 0.1)); halo.addColorStop(1, this.rgba(acc, 0));
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
    this.vignette(ctx, W, H, 0.34);
    const R = reach * 0.86;
    ctx.strokeStyle = this.rgba(acc, moving ? 0.3 : 0.6); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(sx, sy, R, 0, 6.3); ctx.stroke();
    const br = R + 9;
    ctx.strokeStyle = this.rgba(acc, moving ? 0.25 : 0.75); ctx.lineWidth = 1.4;
    for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(sx + dx * br, sy + dy * br - dy * 9);
      ctx.lineTo(sx + dx * br, sy + dy * br);
      ctx.lineTo(sx + dx * br - dx * 9, sy + dy * br);
      ctx.stroke();
    }
    if (moving) {
      ctx.strokeStyle = this.rgba(acc, 0.22); ctx.setLineDash([5, 7]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(to[0], to[1]); ctx.stroke(); ctx.setLineDash([]);
    } else {
      for (const p of [0, 0.5]) {
        const t = (dwell + p) % 1;
        ctx.strokeStyle = this.rgba(acc, 0.45 * (1 - t));
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(sx, sy, R * (0.2 + 1.5 * t), 0, 6.3); ctx.stroke();
      }
      const sweep = -1.571 + dwell * 6.283;
      ctx.strokeStyle = this.rgba(acc, 0.5); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(sweep) * R, sy + Math.sin(sweep) * R); ctx.stroke();
      ctx.fillStyle = this.rgba(acc, 0.85);
      ctx.fillText('ANALYSING  SUB-' + (100 + (k % n) * 7), sx + br + 12, sy - br + 12);
      ctx.fillStyle = '#6B6F76';
      ctx.fillText(Math.round(dwell * 100) + '%', sx + br + 12, sy - br + 30);
    }
    ctx.fillStyle = '#4A4E55';
    ctx.fillText('fragment: 3.2 × 10⁶ nodes · sweep ' + ((k % n) + 1) + '/' + n, 22, H - 18);
  }

  drawIso(ph) {
    const W = 2560, H = 1100, step = 8;
    const ctx = this.pane(this.isoRef, W, H); if (!ctx) return;
    const levels = 20, th = ph * 6.283;
    const cols = Math.ceil(W / step), rows = Math.ceil(H / step);
    if (!this.field) {
      this.field = new Float32Array((cols + 1) * (rows + 1));
      for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++)
        this.field[j * (cols + 1) + i] = this.fbm(i * step / W * 5.4, j * step / H * 3.4, 9);
    }
    const at = (i, j) => this.field[j * (cols + 1) + i];
    const acc = this.accent;
    for (let l = 0; l < levels; l++) {
      const t = ((l + ph) % levels) / levels;
      const hot = Math.abs(t - 0.55) < 0.03;
      ctx.strokeStyle = hot ? this.rgba(acc, 0.85) : 'rgba(186,192,201,' + (0.09 + 0.15 * (1 - Math.abs(t - 0.5) * 2)) + ')';
      ctx.lineWidth = hot ? 1.6 : 0.7;
      ctx.beginPath();
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const a = at(i, j), b = at(i + 1, j), c = at(i + 1, j + 1), d = at(i, j + 1);
        const x0 = i * step, y0 = j * step, sg = [];
        if ((a < t) !== (b < t)) sg.push([x0 + step * (t - a) / (b - a), y0]);
        if ((b < t) !== (c < t)) sg.push([x0 + step, y0 + step * (t - b) / (c - b)]);
        if ((c < t) !== (d < t)) sg.push([x0 + step * (1 - (t - d) / (c - d)), y0 + step]);
        if ((d < t) !== (a < t)) sg.push([x0, y0 + step * (t - a) / (d - a)]);
        if (sg.length >= 2) { ctx.moveTo(sg[0][0], sg[0][1]); ctx.lineTo(sg[1][0], sg[1][1]); }
      }
      ctx.stroke();
    }
    const sx = W / 2 + W * 0.3 * Math.cos(th), sy = H / 2 + H * 0.24 * Math.sin(2 * th);
    const halo = ctx.createRadialGradient(sx, sy, 0, sx, sy, 260);
    halo.addColorStop(0, this.rgba(acc, 0.07)); halo.addColorStop(1, this.rgba(acc, 0));
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
    this.vignette(ctx, W, H, 0.36);
    ctx.fillStyle = '#4A4E55';
    ctx.fillText('scalar field · ' + levels + ' isolines', 22, H - 18);
  }

  drawComet(ph) {
    const W = 2560, H = 1100;
    const ctx = this.pane(this.cometRef, W, H); if (!ctx) return;
    const acc = this.accent;
    ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(186,192,201,.11)';
    ctx.beginPath();
    for (const p of this.paths) {
      p.pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
    }
    ctx.stroke();
    const tail = 9;
    for (const p of this.paths) {
      const n = p.pts.length;
      const head = ((ph + p.off) % 1) * (n - 1);
      for (let k = 0; k < tail; k++) {
        const i = Math.floor(head) - k;
        if (i < 1) continue;
        const a = (1 - k / tail) * 0.75;
        ctx.strokeStyle = this.rgba(acc, a * 0.9);
        ctx.lineWidth = 1.5 * (1 - k / tail) + 0.4;
        ctx.beginPath(); ctx.moveTo(p.pts[i - 1][0], p.pts[i - 1][1]); ctx.lineTo(p.pts[i][0], p.pts[i][1]); ctx.stroke();
      }
    }
    this.vignette(ctx, W, H, 0.3);
    ctx.fillStyle = '#4A4E55';
    ctx.fillText('vector field · ' + this.paths.length + ' streamlines', 22, H - 18);
  }

  renderVals() {
    return {
      twinRef: this.twinRef, isoRef: this.isoRef, cometRef: this.cometRef,
      durStr: String(this.dur),
      phaseStr: this.state.phase.toFixed(2)
    };
  }
}


const view = new Component({ loopSeconds: 12, accent: '#E05A10' });
view.twinRef.current = document.getElementById('stage');
if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
  /* One frame, held. The loop is decoration; a reader who asked the OS to
     stop motion still gets the picture. */
  view.build();
  view.drawTwin(0.25);
} else {
  view.componentDidMount();
}
</script>
